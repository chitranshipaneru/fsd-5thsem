<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Student Management System</h1>

    <div class="form-box">

        <div class="field">
            <label>Student Name</label>
            <input type="text" id="name">
        </div>

        <div class="field">
            <label>Roll No</label>
            <input type="text" id="roll">
        </div>

        <div class="field">
            <label>Course</label>
            <select id="course">
                <option value="">Select Course</option>
                <option>BCA</option>
                <option>B.Tech</option>
                <option>MCA</option>
                <option>MBA</option>
            </select>
        </div>

        <div class="field">
            <label>Marks</label>
            <input type="number" id="marks" min="0" max="100">
        </div>

        <button id="submitButton" onclick="addStudent()">Submit</button>

    </div>

    <input
        type="text"
        id="search"
        placeholder="Search by Name or Roll No"
        oninput="displayStudents()"
    >

    <div class="stats">
        <div>
            <span>Total Students</span>
            <strong id="total">0</strong>
        </div>

        <div>
            <span>Average Marks</span>
            <strong id="average">0</strong>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
                <th>Grade</th>
                <th>Rating</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="studentTable"></tbody>
    </table>

</div>

<script src="script.js"></script>
</body>
</html>
